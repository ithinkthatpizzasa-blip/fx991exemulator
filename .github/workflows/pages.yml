# Runs the test suite on every push; deploys the app to GitHub Pages from the
# repository's default branch. One-time setup: Settings -> Pages -> Source:
# "GitHub Actions".
name: Test and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run manual-example test suite
        run: node --test tests/*.test.js

  deploy:
    needs: test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site (app files only - no tests, tools or reference material)
        run: |
          mkdir _site
          cp -r index.html manifest.json sw.js css js fonts icons _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
