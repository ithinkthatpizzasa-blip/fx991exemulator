<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1e1e20">
<meta name="description" content="Offline scientific calculator (fx-991EX style emulator) as an installable web app.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SciCalc EX</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preload" href="./fonts/saira-semicondensed-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/saira-semicondensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./css/calc.css">
</head>
<body>
<div id="stage">
  <div class="calc" id="calc" aria-label="Scientific calculator">
    <div class="face" id="face">
      <!-- body, panel, solar cell, LCD and keys are generated by js/ui/keyboard.js -->
    </div>
  </div>
</div>
<button id="settings-btn" type="button" aria-label="App settings">⚙</button>
<div id="settings" hidden>
  <div class="sheet">
    <h2>App settings</h2>
    <label><input type="checkbox" id="opt-vibrate"> Vibrate on key press</label>
    <label><input type="checkbox" id="opt-sound"> Key click sound</label>
    <p class="hint">Keyboard: digits, + − * / ^ ( ) . , Enter = “=”, Backspace = DEL, Esc = AC, arrows = cursor pad, F1 = SHIFT, F2 = ALPHA.</p>
    <p class="ver">Version <span id="app-version"></span></p>
    <div class="row">
      <button type="button" id="opt-close">Close</button>
    </div>
  </div>
</div>
<noscript><p style="color:#fff;text-align:center">This calculator needs JavaScript.</p></noscript>
<script type="module" src="./js/main.js"></script>
</body>
</html>
